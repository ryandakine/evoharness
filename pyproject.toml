[project]
name = "evoharness"
version = "0.1.0"
description = "Cost-aware genetic-algorithm harness for optimizing multi-agent LLM systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["litellm>=1.60,<2", "python-dotenv>=1,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
