[project]
name = "evoharness"
version = "0.3.3"
description = "Build, run and optimize small graphs of LLM agents: NSGA-II, PSO, REINFORCE, Shapley attribution, cost tracking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "multi-agent", "swarm", "genetic-algorithm", "shapley", "litellm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
api = ["litellm>=1.60,<2", "python-dotenv>=1,<2", "mcp>=1.0.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
evoharness = "evoharness.cli:main"

[project.urls]
Homepage = "https://github.com/surren83-ctrl/evoharness"
Issues = "https://github.com/surren83-ctrl/evoharness/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) everywhere adds noise for equal-length pairs built in the same scope
